  <script>
    (() => {
      const markChanged = (box) => {
        const answer = box.querySelector('[data-activity-item]');
        answer.value = 'mchoro umewekwa';
        answer.dispatchEvent(new Event('input', { bubbles: true }));
        answer.dispatchEvent(new Event('change', { bubbles: true }));
      };
      document.querySelectorAll('.drawing-answer').forEach((box) => {
        const canvas = box.querySelector('canvas');
        const context = canvas.getContext('2d');
        const status = box.querySelector('.drawing-status');
        const answer = box.querySelector('[data-activity-item]');
        let drawing = false;
        let penDown = false;
        let keyboardX = canvas.width / 2;
        let keyboardY = canvas.height / 2;
        context.lineWidth = 4;
        context.lineCap = 'round';
        context.lineJoin = 'round';
        context.strokeStyle = '#111827';
        const point = (event) => {
          const rect = canvas.getBoundingClientRect();
          return [(event.clientX - rect.left) * canvas.width / rect.width, (event.clientY - rect.top) * canvas.height / rect.height];
        };
        canvas.addEventListener('pointerdown', (event) => {
          drawing = true;
          canvas.setPointerCapture(event.pointerId);
          const [x, y] = point(event);
          context.beginPath();
          context.moveTo(x, y);
        });
        canvas.addEventListener('pointermove', (event) => {
          if (!drawing) return;
          const [x, y] = point(event);
          context.lineTo(x, y);
          context.stroke();
          markChanged(box);
        });
        const stop = () => { drawing = false; };
        canvas.addEventListener('pointerup', stop);
        canvas.addEventListener('pointercancel', stop);
        canvas.addEventListener('keydown', (event) => {
          if (event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            penDown = !penDown;
            status.textContent = penDown ? 'Kalamu inachora.' : 'Kalamu imesimama.';
            return;
          }
          if (event.key === 'Delete' || event.key === 'Backspace') {
            event.preventDefault();
            context.clearRect(0, 0, canvas.width, canvas.height);
            answer.value = '';
            status.textContent = 'Mchoro umefutwa.';
            return;
          }
          const moves = {ArrowLeft:[-8,0], ArrowRight:[8,0], ArrowUp:[0,-8], ArrowDown:[0,8]};
          const move = moves[event.key];
          if (!move) return;
          event.preventDefault();
          const nextX = Math.max(0, Math.min(canvas.width, keyboardX + move[0]));
          const nextY = Math.max(0, Math.min(canvas.height, keyboardY + move[1]));
          if (penDown) {
            context.beginPath();
            context.moveTo(keyboardX, keyboardY);
            context.lineTo(nextX, nextY);
            context.stroke();
            markChanged(box);
          }
          keyboardX = nextX;
          keyboardY = nextY;
        });
        box.querySelector('.clear-drawing').addEventListener('click', () => {
          context.clearRect(0, 0, canvas.width, canvas.height);
          answer.value = '';
          answer.dispatchEvent(new Event('change', { bubbles: true }));
          status.textContent = 'Mchoro umefutwa.';
          canvas.focus();
        });
      });
    })();
  </script>
